name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export web build
        # Remote AI endpoints are read from repo variables (optional — empty is fine).
        env:
          # Accept the value from either the Variables or the Secrets tab, so it works wherever you put it.
          EXPO_PUBLIC_BEAUTIFY_URL: ${{ vars.EXPO_PUBLIC_BEAUTIFY_URL || secrets.EXPO_PUBLIC_BEAUTIFY_URL }}
          EXPO_PUBLIC_GENERATE_URL: ${{ vars.EXPO_PUBLIC_GENERATE_URL || secrets.EXPO_PUBLIC_GENERATE_URL }}
          EXPO_PUBLIC_CLASSIFY_URL: ${{ vars.EXPO_PUBLIC_CLASSIFY_URL || secrets.EXPO_PUBLIC_CLASSIFY_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export -p web

      - name: SPA + Pages fallbacks
        run: |
          cp dist/index.html dist/404.html   # client-side routing fallback for deep links / refresh
          touch dist/.nojekyll               # don't let Jekyll drop the _expo folder

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
